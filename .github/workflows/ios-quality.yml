name: iOS Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build App
        run: xcodebuild -project "StickyNote++.xcodeproj" -scheme "StickyNote++" -configuration Debug -destination "platform=iOS Simulator,name=iPhone 15" build

      - name: Build Widget
        run: xcodebuild -project "StickyNote++.xcodeproj" -scheme "StickyNote++ Widget Extension" -configuration Debug -destination "platform=iOS Simulator,name=iPhone 15" build

      - name: SwiftFormat Check (if installed)
        run: |
          if command -v swiftformat >/dev/null 2>&1; then
            swiftformat . --lint
          else
            echo "swiftformat not installed; skipping."
          fi

      - name: SwiftLint (if installed)
        run: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint
          else
            echo "swiftlint not installed; skipping."
          fi
